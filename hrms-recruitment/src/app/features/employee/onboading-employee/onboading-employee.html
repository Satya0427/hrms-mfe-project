<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <h2>All Employees</h2>

        <div class="actions">
            <mat-form-field appearance="outline" class="search-box">
                <mat-icon matPrefix>search</mat-icon>
                <input matInput placeholder="Search" />
            </mat-form-field>

            <button mat-icon-button color="primary">
                <mat-icon>filter_list</mat-icon>
            </button>

            <button mat-icon-button color="primary">
                <mat-icon>add_circle</mat-icon>
            </button>

            <button mat-icon-button>
                <mat-icon>refresh</mat-icon>
            </button>

            <button mat-icon-button>
                <mat-icon>download</mat-icon>
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table mat-table [dataSource]="employees" class="mat-elevation-z0">

            <!-- Select -->
            <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef>
                    <mat-checkbox></mat-checkbox>
                </th>
                <td mat-cell *matCellDef="let row">
                    <mat-checkbox></mat-checkbox>
                </td>
            </ng-container>

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let row" class="name-cell">
                    <img [src]="row.avatar" />
                    {{ row.name }}
                </td>
            </ng-container>

            <!-- Role -->
            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef>Role</th>
                <td mat-cell *matCellDef="let row">{{ row.role }}</td>
            </ng-container>

            <!-- Department -->
            <ng-container matColumnDef="department">
                <th mat-header-cell *matHeaderCellDef>Department</th>
                <td mat-cell *matCellDef="let row">{{ row.department }}</td>
            </ng-container>

            <!-- Mobile -->
            <ng-container matColumnDef="mobile">
                <th mat-header-cell *matHeaderCellDef>Mobile</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon color="primary" class="icon">call</mat-icon>
                    {{ row.mobile }}
                </td>
            </ng-container>

            <!-- Joining Date -->
            <ng-container matColumnDef="joiningDate">
                <th mat-header-cell *matHeaderCellDef>Joining Date</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon class="icon">calendar_today</mat-icon>
                    {{ row.joiningDate }}
                </td>
            </ng-container>

            <!-- Email -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef>Email</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon color="warn" class="icon">mail</mat-icon>
                    {{ row.email }}
                </td>
            </ng-container>

            <!-- Gender -->
            <ng-container matColumnDef="gender">
                <th mat-header-cell *matHeaderCellDef>Gender</th>
                <td mat-cell *matCellDef="let row">
                    <mat-chip [ngClass]="row.gender.toLowerCase()">
                        {{ row.gender }}
                    </mat-chip>
                </td>
            </ng-container>

            <!-- Address -->
            <ng-container matColumnDef="address">
                <th mat-header-cell *matHeaderCellDef>Address</th>
                <td mat-cell *matCellDef="let row">
                    <mat-icon color="primary" class="icon">location_on</mat-icon>
                    {{ row.address }}
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>
    </div>

</div>
