<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>{{ admin.name }}</h1>

            <div class="meta-row">
                <span class="meta-item">
                    <mat-icon>business</mat-icon>
                    {{ admin.organization }}
                </span>

                <span class="status-chip" [ngClass]="admin.status.toLowerCase()">
                    {{ admin.status }}
                </span>
            </div>
        </div>

        <!-- Back button (required) -->
        <button mat-stroked-button class="back-btn" routerLink="/home/paltform-management/global-admin/global-admin-list">
            Back
        </button>
    </div>

    <div class="content-grid">

        <!-- LEFT -->
        <div>
            <mat-card class="card">
                <h3>Admin Information</h3>

                <div class="info-grid">
                    <div>
                        <label>Email</label>
                        <p>{{ admin.email }}</p>
                    </div>

                    <div>
                        <label>Mobile</label>
                        <p>{{ admin.mobile }}</p>
                    </div>

                    <div>
                        <label>Created On</label>
                        <p>{{ admin.createdOn }}</p>
                    </div>

                    <div>
                        <label>Last Login</label>
                        <p>{{ admin.lastLogin }}</p>
                    </div>
                </div>
            </mat-card>
        </div>

        <!-- RIGHT -->
        <div>
            <mat-card class="card">
                <h3>Actions</h3>

                <button mat-stroked-button>
                    Edit Global Admin
                </button>

                <button mat-stroked-button color="warn">
                    {{ admin.status === 'Active'
                    ? 'Deactivate'
                    : 'Activate' }}
                </button>
            </mat-card>
        </div>

    </div>

</div>
