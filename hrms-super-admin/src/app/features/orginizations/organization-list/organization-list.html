<div>

  <!-- Breadcrumb & Header -->
  <div class="header-section">
    <div class="page-title">
      <h2>All Organizations</h2>
    </div>
    <div class="breadcrumbs">
      <mat-icon class="home-icon">home</mat-icon>
      <span> > Platform Management > Organizations</span>
    </div>
  </div>

  <!-- Toolbar Section -->
  <div class="table-card">
    <div class="table-toolbar">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Search organization..." (keyup)="applyFilter($event)">
      </div>

      <div class="actions">
        <button mat-icon-button color="primary" class="action-btn">
          <mat-icon>filter_list</mat-icon>
        </button>
        <button mat-icon-button class="add-btn" routerLink="/home/paltform-management/orginization/orginization-create">
          <mat-icon>add_circle_outline</mat-icon>
        </button>
        <button mat-icon-button class="action-btn" (click)="get_grid_list()">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button class="action-btn">
          <mat-icon>download</mat-icon>
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table mat-table [dataSource]="organizations" class="organization-table">

        <!-- Checkbox Column -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="$event ? toggleAllRows() : null" [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row">
            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)">
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- Organization Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Organization </th>
          <td mat-cell *matCellDef="let org">
            <div class="name-cell">
              <div class="org-avatar">
                <mat-icon>business</mat-icon>
              </div>
              <div class="org-info">
                <strong>{{ org.name }}</strong>
                <span class="domain-text">{{ org.domain }}</span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Plan Column -->
        <ng-container matColumnDef="plan">
          <th mat-header-cell *matHeaderCellDef> Plan </th>
          <td mat-cell *matCellDef="let org">
            <span class="plan-badge" [class]="org.plan?.toLowerCase()">
              {{ org.plan || 'N/A' }}
            </span>
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let org">
            <span class="status-badge" [class]="org.status">
              {{ org.status | titlecase }}
            </span>
          </td>
        </ng-container>

        <!-- Users Column -->
        <ng-container matColumnDef="users">
          <th mat-header-cell *matHeaderCellDef> Users </th>
          <td mat-cell *matCellDef="let org">
            <div class="icon-text">
              <mat-icon class="icon-users">group</mat-icon>
              {{ org.users || 0 }}
            </div>
          </td>
        </ng-container>

        <!-- Created Date Column -->
        <ng-container matColumnDef="created">
          <th mat-header-cell *matHeaderCellDef> Created On </th>
          <td mat-cell *matCellDef="let org">
            <div class="icon-text">
              <mat-icon class="icon-date">calendar_today</mat-icon>
              {{ org.created | date:'dd MMM yyyy' }}
            </div>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let org">
            <div class="action-buttons">
              <button mat-icon-button class="action-view"
                [routerLink]="['/home/paltform-management/orginization/orginization-view', org.id]" matTooltip="View">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button class="action-edit"
                [routerLink]="['/home/paltform-management/orginization/orginization-create', org.id]" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="openStatusDialog(org)"
                [class]="org.status === 'suspended' ? 'action-activate' : 'action-suspend'"
                [matTooltip]="org.status === 'suspended' ? 'Activate' : 'Suspend'">
                <mat-icon>
                  {{ org.status === 'suspended' ? 'play_circle' : 'pause_circle' }}
                </mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
