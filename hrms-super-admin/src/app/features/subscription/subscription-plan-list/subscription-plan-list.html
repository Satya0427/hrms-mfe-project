<div class="page-container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>Subscription Plans</h1>
            <p class="page-subtitle">
                Manage pricing plans and feature availability
            </p>
        </div>

        <button mat-flat-button color="primary"
            routerLink="/home/paltform-management/subscription-plan/subscription-plan-create">
            <mat-icon>add</mat-icon>
            Create Plan
        </button>
    </div>

    <!-- Plans Table -->
    <div class="table-container mat-elevation-z1">
        <table mat-table [dataSource]="plans">

            <!-- Name -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Plan Name </th>
                <td mat-cell *matCellDef="let plan">
                    <strong>{{ plan.name }}</strong>
                </td>
            </ng-container>

            <!-- Pricing -->
            <ng-container matColumnDef="pricing">
                <th mat-header-cell *matHeaderCellDef> Pricing </th>
                <td mat-cell *matCellDef="let plan">
                    <ng-container *ngIf="plan.monthlyPrice; else custom">
                        ₹{{ plan.monthlyPrice }} / mo<br />
                        <span class="muted">₹{{ plan.yearlyPrice }} / yr</span>
                    </ng-container>
                    <ng-template #custom>
                        <span class="custom">Custom</span>
                    </ng-template>
                </td>
            </ng-container>

            <!-- Employees -->
            <ng-container matColumnDef="employees">
                <th mat-header-cell *matHeaderCellDef> Employees </th>
                <td mat-cell *matCellDef="let plan">
                    {{ plan.employees }}
                </td>
            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Status </th>
                <td mat-cell *matCellDef="let plan">
                    <span class="status-chip" [ngClass]="plan.status.toLowerCase()">
                        {{ plan.status }}
                    </span>
                </td>
            </ng-container>

            <!-- Created -->
            <ng-container matColumnDef="created">
                <th mat-header-cell *matHeaderCellDef> Created On </th>
                <td mat-cell *matCellDef="let plan">
                    {{ plan.created | date:'dd MMM yyyy' }}
                </td>
            </ng-container>

            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let plan">

                    <button mat-icon-button
                        routerLink="/home/paltform-management/subscription-plan/subscription-plan-view">
                        <mat-icon>visibility</mat-icon>
                    </button>

                    <button mat-icon-button
                        routerLink="/home/paltform-management/subscription-plan/subscription-plan-edit">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button (click)="openStatusDialog(plan)">
                        <mat-icon>
                            {{ plan.status === 'Active'
                            ? 'pause_circle'
                            : 'play_circle' }}
                        </mat-icon>
                    </button>


                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>

</div>
